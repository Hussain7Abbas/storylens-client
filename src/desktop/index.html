<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><title>Story Lens Client</title><link rel="stylesheet" href="./style.css"></head>
<body><main><h1>Story Lens Client</h1><p>Connect the browser extension to your installed Claude Code or Codex CLI.</p><section><h2>Connection</h2><p id="status" role="status">Starting…</p><label>Pairing token<input id="token" readonly type="password"></label><div class="actions"><button id="copy" type="button">Copy token</button><button id="rotate" type="button">Rotate token</button></div><p class="hint">Paste the token in Story Lens extension settings. Keep this app open while using Summarize.</p></section><section><h2>Provider commands</h2><form id="settings"><label>Port<input id="port" type="number" min="1024" max="65535" required></label><label>Claude command or path<input id="claudePath" required></label><label>Codex command or path<input id="codexPath" required></label><button type="submit">Save settings</button></form><div class="actions"><h3>Providers</h3><button id="refresh" type="button">Refresh models</button></div><ul id="providers"></ul><p id="modelCount"></p></section><p id="message" role="status"></p></main><script src="./renderer.js"></script></body></html>
